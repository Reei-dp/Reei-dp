<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Цветовые градиенты -->
    <linearGradient id="riyo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090e" />
      <stop offset="50%" stop-color="#10121b" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="45%" stop-color="#ff2a8d" />
      <stop offset="85%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="blade-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff0055" stop-opacity="1" />
      <stop offset="75%" stop-color="#00f5d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Сетка фона -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>

    <!-- Сигнальная полоса опасности Бездны -->
    <pattern id="hazard" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#ff0055" fill-opacity="0.9" />
      <rect x="12" width="12" height="24" fill="#141520" fill-opacity="0.95" />
    </pattern>
  </defs>

  <style>
    @keyframes slice-anim {
      0% { transform: translateX(-600px); opacity: 0; }
      20% { opacity: 1; }
      40% { transform: translateX(900px); opacity: 1; }
      41% { opacity: 0; }
      100% { transform: translateX(900px); opacity: 0; }
    }

    @keyframes snip-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes subtle-glitch {
      0%, 100% { transform: translate(0); }
      92% { transform: translate(0); }
      93% { transform: translate(-2px, 1px); }
      95% { transform: translate(2px, -1px); }
      96% { transform: translate(0); }
    }

    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 5px;
      fill: url(#title-gradient);
      animation: subtle-glitch 5s infinite;
    }

    .sub-title {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      fill: #8b92a5;
    }

    .cursor {
      animation: cursor-blink 0.8s infinite;
    }

    .snip-icon {
      transform-origin: center;
      animation: snip-pulse 2s infinite ease-in-out;
    }

    .laser-slash {
      animation: slice-anim 4.5s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
    }
  </style>

  <!-- Фон -->
  <rect width="850" height="380" fill="url(#riyo-bg)" rx="10" />
  <rect width="850" height="380" fill="url(#grid)" rx="10" />

  <!-- Сигнальные ленты опасности (верх и низ) -->
  <rect x="0" y="0" width="850" height="8" fill="url(#hazard)" rx="8" />
  <rect x="0" y="372" width="850" height="8" fill="url(#hazard)" rx="8" />

  <!-- Угловые технологичные засечки -->
  <path d="M 25 28 L 50 28 M 25 28 L 25 53" stroke="#ff0055" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 825 28 L 800 28 M 825 28 L 825 53" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 25 352 L 50 352 M 25 352 L 25 327" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="square" />
  <path d="M 825 352 L 800 352 M 825 352 L 825 327" stroke="#ff0055" stroke-width="2.5" stroke-linecap="square" />

  <!-- Верхняя строка статуса -->
  <g transform="translate(35, 32)">
    <rect x="0" y="0" width="165" height="18" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-width="1" rx="2" />
    <text x="8" y="13" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#ff0055">✂ SECTOR: THE PIT // 奈落</text>

    <text x="180" y="13" font-family="'Courier New', monospace" font-size="10" fill="#757d91">CLEANERS VANGUARD // AGENT: RIYO REAPER</text>
    <text x="690" y="13" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00f5d4">[SNIP READY]</text>
  </g>

  <!-- Центральный блок: Заголовок RIYO REAPER (Четкая векторная типографика) -->
  <g transform="translate(35, 100)">
    <text x="0" y="0" class="hero-title">RIYO REAPER</text>
    
    <!-- Японский суб-тег и подразделение -->
    <text x="4" y="24" class="sub-title">
      <tspan fill="#ff0055">リヨ・リーパー</tspan>
      <tspan fill="#4d5366"> // </tspan>
      <tspan fill="#00f5d4">JINKI: THE RIPPER</tspan>
      <tspan fill="#4d5366"> // </tspan>
      <tspan fill="#e2e8f0">THE CLEANERS [掃除屋]</tspan>
    </text>

    <!-- Анимированная лазерная линия разреза ножниц через логотип -->
    <g class="laser-slash">
      <line x1="-100" y1="-15" x2="300" y2="-15" stroke="url(#blade-glow)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Декоративная линия разделения -->
  <line x1="35" y1="145" x2="815" y2="145" stroke="#212535" stroke-width="1" />
  <circle cx="425" cy="145" r="3" fill="#ff0055" />

  <!-- Консоль Уборщицы (The Ripper Terminal Window) -->
  <g transform="translate(35, 162)">
    <!-- Фоновое окно терминала -->
    <rect x="0" y="0" width="780" height="190" fill="#0c0d15" rx="6" stroke="#232636" stroke-width="1.2" />

    <!-- Шапка окна -->
    <rect x="0" y="0" width="780" height="26" fill="#141624" rx="6" />
    <circle cx="16" cy="13" r="4.5" fill="#ff0055" />
    <circle cx="31" cy="13" r="4.5" fill="#ffbe0b" />
    <circle cx="46" cy="13" r="4.5" fill="#00f5d4" />
    <text x="68" y="17" font-family="'Courier New', monospace" font-size="11" fill="#8d94a7" font-weight="bold">THE_RIPPER_CONSOLE_V3.1 // PILOT: RIYO_REAPER [Reei-dp]</text>
    <text x="690" y="17" font-family="'Courier New', monospace" font-size="10.5" fill="#00f5d4" font-weight="bold">[LINK_OK]</text>

    <!-- Содержимое терминала -->
    <g transform="translate(20, 52)">
      <text font-family="'Courier New', 'Fira Code', monospace" font-size="12" fill="#e2e8f0">
        <tspan x="0" dy="0" fill="#6c7387">&gt; GIVER:</tspan>
        <tspan dx="12" fill="#ff0055" font-weight="bold">RIYO REAPER (Reei-dp)</tspan>
        <tspan dx="35" fill="#6c7387">AFFILIATION:</tspan>
        <tspan dx="12" fill="#ffffff">THE CLEANERS [掃除屋]</tspan>
        <tspan dx="35" fill="#6c7387">RANK:</tspan>
        <tspan dx="12" fill="#00f5d4">FRONT-LINE</tspan>
      </text>

      <text font-family="'Courier New', 'Fira Code', monospace" font-size="12" fill="#e2e8f0" y="28">
        <tspan x="0" fill="#6c7387">&gt; JINKI (人器):</tspan>
        <tspan dx="12" fill="#ff2a8d" font-weight="bold">"THE RIPPER" (切り裂き魔)</tspan>
        <tspan dx="15" fill="#6c7387">—</tspan>
        <tspan dx="12" fill="#00f5d4">SCISSORS OF ABSOLUTE PURGE</tspan>
      </text>

      <text font-family="'Courier New', 'Fira Code', monospace" font-size="12" fill="#e2e8f0" y="56">
        <tspan x="0" fill="#6c7387">&gt; FOCUS:</tspan>
        <tspan dx="12" fill="#ffbe0b">BACKEND ARCHITECTURE, AUTOMATION &amp; SCALABLE APIS</tspan>
      </text>

      <text font-family="'Courier New', 'Fira Code', monospace" font-size="12" fill="#e2e8f0" y="84">
        <tspan x="0" fill="#6c7387">&gt; MOTTO:</tspan>
        <tspan dx="12" fill="#e2e8f0">"Snip away the bloat, keep what matters."</tspan>
      </text>

      <text font-family="'Courier New', 'Fira Code', monospace" font-size="12.5" fill="#e2e8f0" y="112">
        <tspan x="0" fill="#00f5d4">&gt; riyo --build --optimize --clean</tspan>
        <tspan class="cursor" fill="#ff0055" font-weight="bold"> █</tspan>
      </text>
    </g>
  </g>
</svg>
