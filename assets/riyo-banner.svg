<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10" />
      <stop offset="50%" stop-color="#10111a" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="40%" stop-color="#ff2a8d" />
      <stop offset="80%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="slash-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff0055" stop-opacity="1" />
      <stop offset="70%" stop-color="#00f5d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <pattern id="card-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes blade-sweep {
      0% { transform: translateX(-500px); opacity: 0; }
      15% { opacity: 1; }
      35% { transform: translateX(850px); opacity: 1; }
      36% { opacity: 0; }
      100% { transform: translateX(850px); opacity: 0; }
    }

    @keyframes cursor-flash {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 4px;
      fill: url(#title-grad);
    }

    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    .cursor {
      animation: cursor-flash 0.8s infinite;
    }

    .slash-glow {
      animation: blade-sweep 5s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>

  <!-- Outer Window Container -->
  <rect width="850" height="340" fill="url(#card-bg)" rx="10" stroke="#222538" stroke-width="1.2" />
  <rect width="850" height="340" fill="url(#card-grid)" rx="10" />

  <!-- Window Header Bar -->
  <path d="M 0 10 Q 0 0 10 0 L 840 0 Q 850 0 850 10 L 850 36 L 0 36 Z" fill="#131522" />
  <line x1="0" y1="36" x2="850" y2="36" stroke="#222538" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="18" r="4.5" fill="#ff0055" />
  <circle cx="39" cy="18" r="4.5" fill="#ffbe0b" />
  <circle cx="54" cy="18" r="4.5" fill="#00f5d4" />
  <text x="74" y="22" class="mono" font-size="11" fill="#8d94a7" font-weight="bold">THE_RIPPER_CONSOLE // RIYO_REAPER [Reei-dp]</text>
  <text x="826" y="22" text-anchor="end" class="mono" font-size="10.5" fill="#00f5d4" font-weight="bold">● ACTIVE // PIT_SECTOR_07</text>

  <!-- TOP HERO ROW (y: 52 to 140) -->
  <!-- Left: Hero Title & Badges -->
  <g transform="translate(36, 92)">
    <text x="0" y="0" class="title">RIYO REAPER</text>
    <text x="2" y="24" class="mono" font-size="11.5" font-weight="bold" fill="#7d8498">
      <tspan fill="#ff0055">リヨ・リーパー</tspan>
      <tspan fill="#41475c"> // </tspan>
      <tspan fill="#00f5d4">JINKI: THE RIPPER</tspan>
      <tspan fill="#41475c"> // </tspan>
      <tspan fill="#e2e8f0">THE CLEANERS [掃除屋]</tspan>
    </text>

    <!-- Animated Scissor Slash -->
    <g class="slash-glow">
      <line x1="-150" y1="-14" x2="250" y2="-14" stroke="url(#slash-line)" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right: Balanced Status Badge -->
  <g transform="translate(586, 52)">
    <rect width="228" height="74" rx="6" fill="#0c0e17" stroke="#1f2336" stroke-width="1" />
    <path d="M 0 0 L 16 0 M 0 0 L 0 16" stroke="#ff0055" stroke-width="2" />
    <path d="M 228 74 L 212 74 M 228 74 L 228 58" stroke="#00f5d4" stroke-width="2" />
    <text x="16" y="25" class="mono" font-size="10" fill="#7d8498">AFFILIATION : <tspan fill="#ffffff" font-weight="bold">THE CLEANERS</tspan></text>
    <text x="16" y="44" class="mono" font-size="10" fill="#7d8498">OPERATIVE   : <tspan fill="#ff0055" font-weight="bold">RIYO [GIVER]</tspan></text>
    <text x="16" y="63" class="mono" font-size="10" fill="#7d8498">PROTOCOL    : <tspan fill="#00f5d4" font-weight="bold">SNIP-SNIP ✂</tspan></text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="144" x2="814" y2="144" stroke="#1c1f2e" stroke-width="1" />

  <!-- LOWER TERMINAL GRID (y: 156 to 316) -->
  <g transform="translate(36, 156)">
    <!-- Terminal Background Box -->
    <rect width="778" height="154" rx="6" fill="#0b0d14" stroke="#1a1d2c" stroke-width="1" />

    <!-- Row 1: Giver & Role -->
    <text x="20" y="32" class="mono" font-size="11" fill="#697184">&gt; GIVER</text>
    <text x="96" y="32" class="mono" font-size="11" fill="#ff0055" font-weight="bold">Riyo Reaper (Reei-dp)</text>

    <text x="440" y="32" class="mono" font-size="11" fill="#697184">// ROLE</text>
    <text x="520" y="32" class="mono" font-size="11" fill="#e2e8f0" font-weight="bold">Backend &amp; Bot Engineer</text>

    <!-- Row 2: Jinki & Stack -->
    <text x="20" y="62" class="mono" font-size="11" fill="#697184">&gt; JINKI</text>
    <text x="96" y="62" class="mono" font-size="11" fill="#00f5d4" font-weight="bold">"The Ripper" (切り裂き魔)</text>

    <text x="440" y="62" class="mono" font-size="11" fill="#697184">// ARSENAL</text>
    <text x="520" y="62" class="mono" font-size="11" fill="#ffbe0b" font-weight="bold">Go • Python • Docker • Linux</text>

    <!-- Row 3: Focus -->
    <text x="20" y="92" class="mono" font-size="11" fill="#697184">&gt; FOCUS</text>
    <text x="96" y="92" class="mono" font-size="11" fill="#9da4b8">High-performance microservices, Telegram bots &amp; scalable APIs</text>

    <!-- Row 4: Command Line Prompt -->
    <g transform="translate(20, 126)">
      <rect x="-4" y="-14" width="742" height="24" rx="4" fill="#121420" stroke="#1f2336" stroke-width="0.8" />
      <text x="12" y="3" class="mono" font-size="11" fill="#00f5d4">riyo@cleaners:~$</text>
      <text x="145" y="3" class="mono" font-size="11" fill="#ffffff">./riyo --build --optimize --clean</text>
      <text x="415" y="3" class="cursor" font-family="monospace" font-size="11" fill="#ff0055" font-weight="bold">█</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <path d="M 0 336 L 850 336 L 850 339 Q 850 340 840 340 L 10 340 Q 0 340 0 339 Z" fill="url(#title-grad)" />
</svg>
