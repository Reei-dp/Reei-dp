<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Манга-скринтон (точечная текстура печати) -->
    <pattern id="screentone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="#ffffff" fill-opacity="0.05" />
    </pattern>

    <!-- Диагональная штриховка манги -->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.2" />
    </pattern>

    <linearGradient id="blood-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8001f" />
      <stop offset="50%" stop-color="#ff0033" />
      <stop offset="100%" stop-color="#7a0014" />
    </linearGradient>
  </defs>

  <style>
    @keyframes slash-cut {
      0% { transform: scaleX(0); opacity: 0; }
      10% { transform: scaleX(1); opacity: 1; }
      25% { opacity: 1; }
      35% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes flicker-ink {
      0%, 100% { opacity: 1; }
      89% { opacity: 1; }
      90% { opacity: 0.7; }
      91% { opacity: 1; }
      96% { opacity: 0.85; }
      97% { opacity: 1; }
    }

    .manga-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 88px;
      letter-spacing: 12px;
      text-transform: uppercase;
    }

    .kanji {
      font-family: 'Noto Sans CJK JP', 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      font-weight: 900;
    }

    .mono-raw {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    .ink-slash {
      transform-origin: 35px 120px;
      animation: slash-cut 4.5s infinite cubic-bezier(0.1, 0.9, 0.2, 1);
    }
  </style>

  <!-- Фон: Глубокая тьма манги + скринтон -->
  <rect width="850" height="260" fill="#070709" />
  <rect width="850" height="260" fill="url(#screentone)" />
  <rect x="0" y="0" width="850" height="260" fill="url(#hatch)" />

  <!-- Рамка манга-фрейма (грубый стиль мангаки) -->
  <rect x="18" y="18" width="814" height="224" fill="none" stroke="#1f2029" stroke-width="1.5" />
  <rect x="22" y="22" width="806" height="216" fill="none" stroke="#ff0033" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Японские вертикальные блоки (в стиле оригинального тома Gachiakuta) -->
  <g transform="translate(730, 42)">
    <!-- Блок 1: Риё -->
    <rect x="0" y="0" width="30" height="96" fill="#ff0033" />
    <text x="15" y="26" class="kanji" font-size="16" fill="#070709" text-anchor="middle">リ</text>
    <text x="15" y="52" class="kanji" font-size="16" fill="#070709" text-anchor="middle">ヨ</text>
    <text x="15" y="78" class="kanji" font-size="14" fill="#070709" text-anchor="middle">通</text>

    <!-- Блок 2: Дзинки -->
    <rect x="42" y="10" width="26" height="150" fill="#12131a" stroke="#252736" stroke-width="1" />
    <text x="55" y="32" class="kanji" font-size="11" fill="#8c91a4" text-anchor="middle">人</text>
    <text x="55" y="52" class="kanji" font-size="11" fill="#8c91a4" text-anchor="middle">器</text>
    <text x="55" y="78" class="kanji" font-size="11" fill="#ff0033" text-anchor="middle">切</text>
    <text x="55" y="96" class="kanji" font-size="11" fill="#ff0033" text-anchor="middle">り</text>
    <text x="55" y="114" class="kanji" font-size="11" fill="#ff0033" text-anchor="middle">裂</text>
    <text x="55" y="132" class="kanji" font-size="11" fill="#ff0033" text-anchor="middle">き</text>
    <text x="55" y="150" class="kanji" font-size="11" fill="#ff0033" text-anchor="middle">魔</text>
  </g>

  <!-- Огромный силуэт ножниц на заднем плане (брутальный грандж) -->
  <g transform="translate(540, 25)" stroke="#1a1c26" stroke-width="3" fill="none" opacity="0.65">
    <!-- Лезвие 1 -->
    <path d="M 20 20 L 160 190 M 160 190 C 180 210 210 200 205 175 C 200 155 175 160 160 190" />
    <!-- Лезвие 2 -->
    <path d="M 160 20 L 20 190 M 20 190 C 0 210 -30 200 -25 175 C -20 155 5 160 20 190" />
    <!-- Заклепка / Шарнир -->
    <circle cx="90" cy="105" r="7" fill="#ff0033" stroke="#ff0033" />
  </g>

  <!-- Основной заголовок: RIYO -->
  <g transform="translate(52, 126)">
    <!-- Кровавая тень со смещением (manga offset) -->
    <text x="3" y="3" class="manga-title" fill="#ff0033" opacity="0.85">RIYO</text>
    <!-- Белый костяной слой -->
    <text x="0" y="0" class="manga-title" fill="#f0f1f5">RIYO</text>

    <!-- Динамический разрез лезвия через текст -->
    <line x1="-30" y1="-32" x2="340" y2="-32" stroke="#ff0033" stroke-width="3" class="ink-slash" />
  </g>

  <!-- Сабтайтл и статус Уборщиков Бездны -->
  <g transform="translate(54, 162)">
    <text class="mono-raw" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="3">
      THE RIPPER // THE CLEANERS
    </text>
    <text y="24" class="mono-raw" font-size="11" fill="#757c91" letter-spacing="1.5">
      FULL-STACK ENGINEER • AUTOMATIONS • REVERSE ENGINEERING
    </text>
  </g>

  <!-- Нижняя информационная линия -->
  <g transform="translate(54, 216)">
    <line x1="0" y1="-12" x2="650" y2="-12" stroke="#1d1e28" stroke-width="1" />
    <text class="mono-raw" font-size="10" fill="#ff0033" font-weight="bold">
      [07 // PIT SECTOR]
    </text>
    <text x="140" y="0" class="mono-raw" font-size="10" fill="#52576b">
      REEI-DP • GACHI.RIYO@GMAIL.COM • ALL TRASH PURGED
    </text>
  </g>
</svg>
